name: "Flutter CI Reusable Workflow"

on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: '3.32.0'

      flutter_channel:
        required: false
        type: string
        default: 'stable'

      coverage_threshold:
        required: false
        type: string
        default: '80'

      build_ios:
        required: false
        type: boolean
        default: false

      package_name:
        required: true
        type: string

      ios_bundle_id:
        required: false
        type: string

      version_name:
        required: true
        type: string

      playstore_track:
        required: false
        type: string
        default: internal

    secrets:
      SONAR_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

      ANDROID_KEYSTORE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false

      PLAYSTORE_SERVICE_ACCOUNT:
        required: false

      IOS_CERT_P12_BASE64:
        required: false
      IOS_CERT_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false

# 🔒 Prevent parallel versionCode collisions
concurrency:
  group: playstore-${{ inputs.package_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}

jobs:
  # ---------------------------------------------------------------------------
  # BUILD SETUP
  # ---------------------------------------------------------------------------
  build_flutter_project:
    name: Setup Flutter Project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

  # ---------------------------------------------------------------------------
  # ANALYZER
  # ---------------------------------------------------------------------------
  dart_analyzer:
    name: Run Dart Analyzer
    runs-on: ubuntu-latest
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Run Dart Analyzer
        run: |
          dart analyze > analyzer-report.txt || true
          if grep -q "error •" analyzer-report.txt; then
            echo "❌ Dart analyzer errors found"
            exit 1
          fi

      - name: Upload Analyzer Report
        uses: actions/upload-artifact@v4
        with:
          name: Dart-Analyzer-Reports
          path: analyzer-report.txt

  # ---------------------------------------------------------------------------
  # TESTS + COVERAGE + REPORTS (ARTIFACT-ONLY)
  # ---------------------------------------------------------------------------
  run_tests:
    name: Run Flutter Tests & Coverage
    runs-on: ubuntu-latest
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------
      # Setup Flutter + Dart Utilities
      # -------------------------------------------------------
      - name: Setup Flutter and Dart Utilities
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      # -------------------------------------------------------
      # Run Tests (machine output → temp file)
      # -------------------------------------------------------
      - name: Run Flutter Tests
        run: |
          mkdir -p /tmp/test-results /tmp/coverage
          
          flutter test \
            --coverage \
            --machine \
            > /tmp/test-results/test-output.json || true

      # -------------------------------------------------------
      # Convert JSON → JUnit (temp)
      # -------------------------------------------------------
      - name: Generate JUnit Report
        run: |
          dart .github/tool/json_to_junit.dart \
            /tmp/test-results/test-output.json \
            /tmp/test-results/junit.xml

      # -------------------------------------------------------
      # Generate Coverage HTML (temp)
      # -------------------------------------------------------
      - name: Generate Coverage HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info --output-directory /tmp/coverage/html

      # -------------------------------------------------------
      # Enforce Coverage Threshold
      # -------------------------------------------------------
      - name: Enforce Coverage Threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | awk '{print $2}' | sed 's/%//')
          REQUIRED=${{ inputs.coverage_threshold }}
          
          echo "Coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < $REQUIRED" | bc -l) )); then
            echo "Coverage below threshold ($REQUIRED%)"
            exit 1
          fi

      # -------------------------------------------------------
      # Upload Artifacts
      # -------------------------------------------------------
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: /tmp/test-results

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: /tmp/coverage

  # ---------------------------------------------------------------------------
  # ANDROID BUILD
  # ---------------------------------------------------------------------------
  build_android:
    name: Build Android (Debug / Release)
    runs-on: ubuntu-latest
    needs: [dart_analyzer, run_tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      # ----------------------------
      # Detect Keystore
      # ----------------------------
      - name: Check Keystore Availability
        id: keystore_check
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️ No keystore found. Building DEBUG APK."
          else
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore found. Building RELEASE AAB."
          fi

      # ----------------------------
      # RELEASE BUILD (SIGNED)
      # ----------------------------
      - name: Decode Android Keystore
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build RELEASE AAB
        if: steps.keystore_check.outputs.has_keystore == 'true'
        run: |
          flutter build appbundle --release \
            --build-name=${{ inputs.version_name }} 

      # ----------------------------
      # DEBUG BUILD (NO KEYSTORE)
      # ----------------------------
      - name: Build DEBUG APK
        if: steps.keystore_check.outputs.has_keystore == 'false'
        run: |
          flutter build apk --debug \
            --build-name=${{ inputs.version_name }} \
            --build-number=1

      # ----------------------------
      # Upload Artifacts
      # ----------------------------
      - name: Upload Android Build Output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-debug.apk
          

  # ---------------------------------------------------------------------------
  # iOS BUILD (Debug / Release)
  # ---------------------------------------------------------------------------
  build_ios:
    name: Build iOS (Debug / Release)
    runs-on: macos-latest
    needs: [dart_analyzer, run_tests]
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N || true
          pod --version
          
      - name: Generate iOS Flutter config
        run: |
          flutter --version
          flutter pub get
          flutter precache --ios
          flutter build ios --debug --no-codesign || true

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ----------------------------
      # Detect iOS Signing Assets
      # ----------------------------
      - name: Check iOS Signing Availability
        id: ios_signing_check
        run: |
          if [ -z "${{ secrets.IOS_CERT_P12_BASE64 }}" ] || \
             [ -z "${{ secrets.IOS_CERT_PASSWORD }}" ] || \
             [ -z "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "⚠️ No iOS signing assets found. Building DEBUG (no codesign)."
          else
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "✅ iOS signing assets found. Building RELEASE IPA."
          fi

      # ----------------------------
      # RELEASE BUILD (SIGNED IPA)
      # ----------------------------
      - name: Install iOS Certificate + Profile
        if: steps.ios_signing_check.outputs.has_signing == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ inputs.ios_bundle_id }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="temp_pw"

          # Create + unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make it default (IMPORTANT)
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import certificate (.p12)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to access key without UI prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile using UUID filename (IMPORTANT)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          echo "✅ Installed provisioning profile UUID=$UUID"

          # Validate profile matches the expected bundle id (IMPORTANT)
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_BUNDLE="${APP_ID#*.}"

          echo "Expected iOS bundle id: ${IOS_BUNDLE_ID}"
          echo "Profile bundle id:      ${PROFILE_BUNDLE}"

          if [ -n "${IOS_BUNDLE_ID}" ] && [ "${PROFILE_BUNDLE}" != "${IOS_BUNDLE_ID}" ]; then
            echo "❌ Provisioning profile bundle id does not match inputs.ios_bundle_id"
            exit 1
          fi
      

      # Build signed IPA (requires signing assets present in project settings)
      - name: Build RELEASE IPA
        if: steps.ios_signing_check.outputs.has_signing == 'true'
        run: |
          flutter build ipa --release

      # ----------------------------
      # DEBUG BUILD (NO SIGNING)
      # ----------------------------
      - name: Build DEBUG iOS (no codesign)
        if: steps.ios_signing_check.outputs.has_signing == 'false'
        run: |
          flutter build ios --debug --no-codesign

      # ----------------------------
      # Upload Artifacts
      # ----------------------------
      - name: Upload iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            build/ios/iphoneos/*.app
            build/ios/iphoneos/Runner.app
            build/ios/ipa/*.ipa
