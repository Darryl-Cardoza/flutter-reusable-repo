name: "Flutter CI Reusable Workflow"

on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: '3.32.0'

      flutter_channel:
        required: false
        type: string
        default: 'stable'

      coverage_threshold:
        required: false
        type: string
        default: '80'

      build_ios:
        required: false
        type: boolean
        default: false

      package_name:
        required: true
        type: string

      ios_bundle_id:
        required: false
        type: string

      version_name:
        required: true
        type: string

      playstore_track:
        required: false
        type: string
        default: internal

    secrets:
      SONAR_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

# 🔒 Prevent parallel versionCode collisions
concurrency:
  group: playstore-${{ inputs.package_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}

jobs:
  # ---------------------------------------------------------------------------
  # BUILD SETUP
  # ---------------------------------------------------------------------------
  build_flutter_project:
    name: Setup Flutter Project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

  # ---------------------------------------------------------------------------
  # ANALYZER
  # ---------------------------------------------------------------------------
  dart_analyzer:
    name: Run Dart Analyzer
    runs-on: ubuntu-latest
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Run Dart Analyzer
        run: |
          dart analyze > analyzer-report.txt || true
          if grep -q "error •" analyzer-report.txt; then
            echo "❌ Dart analyzer errors found"
            exit 1
          fi

      - name: Upload Analyzer Report
        uses: actions/upload-artifact@v4
        with:
          name: Dart-Analyzer-Reports
          path: analyzer-report.txt

  # ---------------------------------------------------------------------------
  # TESTS + COVERAGE + REPORTS (ARTIFACT-ONLY)
  # ---------------------------------------------------------------------------
  run_tests:
    name: Run Flutter Tests & Coverage
    runs-on: ubuntu-latest
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------
      # Setup Flutter + Dart Utilities
      # -------------------------------------------------------
      - name: Setup Flutter and Dart Utilities
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      # -------------------------------------------------------
      # Run Tests (machine output → temp file)
      # -------------------------------------------------------
      - name: Run Flutter Tests
        run: |
          mkdir -p /tmp/test-results /tmp/coverage
          
          flutter test \
            --coverage \
            --machine \
            > /tmp/test-results/test-output.json || true

      # -------------------------------------------------------
      # Convert JSON → JUnit (temp)
      # -------------------------------------------------------
      - name: Generate JUnit Report
        run: |
          dart .github/tool/json_to_junit.dart \
            /tmp/test-results/test-output.json \
            /tmp/test-results/junit.xml

      # -------------------------------------------------------
      # Generate Coverage HTML (temp)
      # -------------------------------------------------------
      - name: Generate Coverage HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info --output-directory /tmp/coverage/html

      # -------------------------------------------------------
      # Enforce Coverage Threshold
      # -------------------------------------------------------
      - name: Enforce Coverage Threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | awk '{print $2}' | sed 's/%//')
          REQUIRED=${{ inputs.coverage_threshold }}
          
          echo "Coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < $REQUIRED" | bc -l) )); then
            echo "Coverage below threshold ($REQUIRED%)"
            exit 1
          fi

      # -------------------------------------------------------
      # Upload Artifacts
      # -------------------------------------------------------
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: /tmp/test-results

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: /tmp/coverage

  # ---------------------------------------------------------------------------
  # ANDROID BUILD (UNSIGNED)
  # ---------------------------------------------------------------------------
  build_android:
    name: Build Android (DEBUG only - no keystore)
    runs-on: ubuntu-latest
    needs: [ dart_analyzer, run_tests ]

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ Debug artifacts do not need your release keystore
      - name: Build DEBUG APK
        run: |
          flutter build apk --debug \
            --build-name=${{ inputs.version_name }} \
            --build-number=1

      - name: Build DEBUG AAB
        run: |
          flutter build appbundle --debug \
            --build-name=${{ inputs.version_name }} \
            --build-number=1

      - name: Upload Android Debug Outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-output
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/debug/*.aab


  # ---------------------------------------------------------------------------
  # iOS BUILD (UNSIGNED ARCHIVE ONLY)
  # ---------------------------------------------------------------------------
  build_ios:
    name: Build iOS (UNSIGNED Archive)
    runs-on: macos-latest
    needs: [ dart_analyzer, run_tests ]
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate iOS bundle id input
        run: |
          if [ -z "${{ inputs.ios_bundle_id }}" ]; then
            echo "❌ inputs.ios_bundle_id is required when build_ios=true"
            exit 1
          fi

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Precache iOS
        run: flutter precache --ios

      - name: Generate iOS config
        run: flutter build ios --debug --no-codesign || true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N || true
          pod --version

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # Build archive without signing
      - name: Build iOS Archive (no codesign)
        run: |
          set -e
          flutter build ios --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive
          cd ..

      - name: Upload iOS Unsigned Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-archive
          path: ${{ runner.temp }}/Runner.xcarchive
