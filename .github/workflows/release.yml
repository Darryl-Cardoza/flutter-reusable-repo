name: "Reusable Flutter CD"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      deploy_to_cloud:
        required: false
        type: boolean
        default: false

      enable_aws:
        required: false
        type: boolean
        default: false

      terraform_working_dir:
        required: false
        type: string
        default: './terraform'

      deploy_to_playstore:
        required: false
        type: boolean
        default: false

      playstore_track:
        required: false
        type: string
        default: internal

      playstore_status:
        required: false
        type: string
        default: completed

      package_name:
        required: true
        type: string

      playstore_metadata_path:
        required: false
        type: string
        default: playstore/metadata

      playstore_images_path:
        required: false
        type: string
        default: playstore/images

      deploy_to_testflight:
        required: false
        type: boolean
        default: false

      ios_bundle_id:
        required: false
        type: string
        default: ''

    secrets:
      # AWS Secrets (optional)
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

      # Android Signing
      ANDROID_KEYSTORE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      PLAYSTORE_SERVICE_ACCOUNT:
        required: false

      # iOS Signing
      IOS_CERT_P12_BASE64:
        required: false
      IOS_CERT_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false

      # App Store Connect Credentials
      APPSTORE_ISSUER_ID:
        required: false
      APPSTORE_KEY_ID:
        required: false
      APPSTORE_PRIVATE_KEY:
        required: false

jobs:
  # CREATE GITHUB RELEASE
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-debug-outputs
          path: release/android

      - name: Download unsigned iOS archive
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: release/ios

      - name: Determine next GitHub version
        id: version_check
        run: |
          BASE_VERSION="${{ inputs.version }}"
          git fetch --tags
          CURRENT_VERSION="$BASE_VERSION"

          while git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; do
            IFS='.' read -r major minor patch <<<"$CURRENT_VERSION"
            patch=$((patch + 1))
            CURRENT_VERSION="$major.$minor.$patch"
          done

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: Release v${{ steps.version_check.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SIGN ANDROID
  sign_android:
    name: Sign Android
    if: ${{ inputs.deploy_to_playstore }}
    needs: create_release
    runs-on: ubuntu-latest

    steps:
      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-debug-outputs
          path: release/android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > /tmp/upload-keystore.jks

      - name: Sign APK
        run: |
          set -e
          APK=$(find release/android -name "*release*.apk" | head -n 1)
          zipalign -f 4 "$APK" /tmp/aligned.apk

          apksigner sign \
            --ks /tmp/upload-keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out release/android/app-release-signed.apk \
            /tmp/aligned.apk

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-signed
          path: release/android/app-release-signed.apk

  # DEPLOY TO PLAY STORE
  deploy_playstore:
    name: Deploy to Google Play Store
    if: ${{ inputs.deploy_to_playstore }}
    needs: sign_android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: 3.32.0
          flutter_channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build RELEASE AAB (signed)
        run: |
          flutter build appbundle --release \
            --build-name=${{ inputs.version }} \
            --build-number=1

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.playstore_track }}
          status: ${{ inputs.playstore_status }}
          metadataPath: ${{ inputs.playstore_metadata_path }}
          imagesPath: ${{ inputs.playstore_images_path }}
          inAppUpdatePriority: 2

  # SIGN iOS (EXPORT IPA FROM ARCHIVE)
  sign_ios:
    name: Sign iOS & Export IPA
    if: ${{ inputs.deploy_to_testflight }}
    needs: create_release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned iOS archive
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: release/ios

      - name: Install certificate & profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p temp "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Export IPA
        run: |
          ARCHIVE=$(find release/ios -name "*.xcarchive" | head -n 1)
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-signed
          path: ${{ runner.temp }}/export/*.ipa

  # DEPLOY TO TESTFLIGHT
  deploy_testflight:
    name: Deploy to TestFlight
    if: ${{ inputs.deploy_to_testflight }}
    needs: sign_ios
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-signed
          path: release/ios

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          IPA=$(find release/ios -name "*.ipa" | head -n 1)
          fastlane run upload_to_testflight ipa:"$IPA"
